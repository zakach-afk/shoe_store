{% extends 'base.html' %}
{% load static %}

{% block title %}Size Guide | SOLO FOOTWEAR{% endblock %}

{% block content %}
<section class="max-w-6xl mx-auto px-4 py-12 md:py-16 text-center">
    <!-- Header Title -->
    <h1 class="text-3xl md:text-5xl font-serif font-light tracking-[0.25em] text-gray-900 uppercase mb-8 md:mb-12">
        SIZE GUIDE
    </h1>

    <!-- Size Chart Graphic Container (Matching Reference) -->
    <div class="max-w-3xl mx-auto bg-white p-2 md:p-6 rounded-2xl shadow-md border border-gray-200">
        <img src="{% static 'images/size_chart.png' %}" alt="Size Chart - US and EURO Size Conversion Guide" class="w-full h-auto object-contain mx-auto rounded-lg">
    </div>
</section>
{% endblock %}
